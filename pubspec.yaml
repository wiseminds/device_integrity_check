name: device_integrity_check
description: >-
  Root, jailbreak, emulator and developer-mode detection for Flutter. Reports
  each signal separately and tells you which checks could not run, so a failed
  probe is never mistaken for a clean device.
version: 1.0.0

repository: https://github.com/wiseminds/device_integrity_check
issue_tracker: https://github.com/wiseminds/device_integrity_check/issues

topics:
  - security
  - root-detection
  - jailbreak
  - emulator

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.wiseminds.device_integrity_check
        pluginClass: DeviceIntegrityPlugin
      ios:
        pluginClass: DeviceIntegrityPlugin
        sharedDarwinSource: false
